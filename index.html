<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Service Reminder System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🚗 Vehicle Service Reminder</h1>

        <div class="card">
            <label>Owner Name</label>
            <input type="text" placeholder="Enter owner name">

            <label>Vehicle Number</label>
            <input type="text" placeholder="TN XX XX XXXX">

            <label>Last Service Date</label>
            <input type="date">

            <label>Next Service Date</label>
            <input type="date">

            <button>Set Reminder</button>
        </div>

        <div class="reminder-box">
            <h2>Upcoming Service</h2>
            <p><strong>Vehicle:</strong> TN 01 AB 1234</p>
            <p><strong>Owner:</strong> John</p>
            <p><strong>Next Service:</strong> 15 Nov 2026</p>
        </div>
    </div>

</body>
</html>
